<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Vehicle Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; font-family: 'Poppins', sans-serif; }
        .login-card { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 450px; margin: 100px auto; overflow: hidden; }
        .login-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 30px; text-align: center; color: white; }
        .login-body { padding: 40px; }
        .btn-login { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; padding: 12px; width: 100%; color: white; border-radius: 10px; font-weight: 600; }
        .role-btn { cursor: pointer; padding: 10px; border-radius: 10px; text-align: center; border: 2px solid #e0e0e0; margin-bottom: 10px; }
        .role-btn.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-color: #667eea; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-car fa-3x mb-3"></i>
                <h2>Smart Vehicle Service</h2>
                <p>Login to your account</p>
            </div>
            <div class="login-body">
                <div class="row">
                    <div class="col-4"><div class="role-btn active" data-role="user">User</div></div>
                    <div class="col-4"><div class="role-btn" data-role="mechanic">Mechanic</div></div>
                    <div class="col-4"><div class="role-btn" data-role="admin">Admin</div></div>
                </div>
                <form id="loginForm">
                    <div class="mb-3"><label>Email</label><input type="email" id="email" class="form-control" required></div>
                    <div class="mb-3"><label>Password</label><input type="password" id="password" class="form-control" required></div>
                    <input type="hidden" id="role" value="user">
                    <button type="submit" class="btn-login">Login</button>
                </form>
                <div class="text-center mt-3"><a href="/register">Don't have an account? Register</a><br><a href="/">← Back to Home</a></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.onclick = function() {
                document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('role').value = this.getAttribute('data-role');
                
                // Clear email and password when role changes
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            };
        });
        
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    email: document.getElementById('email').value, 
                    password: document.getElementById('password').value, 
                    role: document.getElementById('role').value 
                })
            });
            const data = await response.json();
            if (data.success) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                let redirect = data.user.role === 'admin' ? '/admin-dashboard' : data.user.role === 'mechanic' ? '/mechanic-dashboard' : '/user-dashboard';
                window.location.href = redirect;
            } else { 
                Swal.fire('Error', data.message, 'error'); 
            }
        };
    </script>
</body>
</html>
