<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="container mt-4">
    <h2>My Bookings</h2>
    
    <!-- 🔴 TEST CANCEL BUTTON -->
    <button onclick="testCancel()" class="btn btn-danger mb-3">🔴 Test Cancel Booking</button>
    
    <div id="bookingsList" class="mt-3">
        <div class="text-center">Loading bookings...</div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';

    // Load bookings
    async function loadBookings() {
        try {
            const response = await fetch('/api/user/bookings', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            
            if (data.success && data.bookings) {
                displayBookings(data.bookings);
            }
        } catch (error) {
            console.error('Error loading bookings:', error);
        }
    }

    function displayBookings(bookings) {
        const container = document.getElementById('bookingsList');
        if (!bookings || bookings.length === 0) {
            container.innerHTML = '<div class="alert alert-info">No bookings found</div>';
            return;
        }

        container.innerHTML = bookings.map(b => `
            <div class="card mb-2">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <div>
                            <strong>ID:</strong> ${b._id}<br>
                            <strong>Service:</strong> ${b.serviceType}<br>
                            <strong>Vehicle:</strong> ${b.vehicleModel} (${b.vehicleNumber})<br>
                            <strong>Status:</strong> <span class="badge bg-${b.status === 'completed' ? 'success' : b.status === 'cancelled' ? 'danger' : 'warning'}">${b.status}</span>
                        </div>
                        <div>
                            ${b.status !== 'cancelled' ? `<button class="btn btn-sm btn-danger" onclick="cancelBooking('${b._id}')">Cancel</button>` : ''}
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // ✅ CANCEL BOOKING FUNCTION
    async function cancelBooking(bookingId) {
        const result = await Swal.fire({
            title: 'Cancel Booking?',
            text: 'Are you sure?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Yes, Cancel'
        });

        if (result.isConfirmed) {
            try {
                const response = await fetch(`/api/bookings/cancel/${bookingId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ reason: 'User requested cancellation' })
                });
                const data = await response.json();
                
                if (data.success) {
                    Swal.fire('Cancelled!', 'Booking cancelled successfully', 'success');
                    loadBookings();
                } else {
                    Swal.fire('Error', data.message, 'error');
                }
            } catch (error) {
                Swal.fire('Error', 'Network error', 'error');
            }
        }
    }

    // 🔴 TEST CANCEL FUNCTION
    async function testCancel() {
        const bookingId = prompt('Enter Booking ID to cancel:');
        if (!bookingId) return;

        try {
            const response = await fetch(`/api/bookings/cancel/${bookingId}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ reason: 'Testing cancellation' })
            });
            const data = await response.json();
            console.log('Cancel response:', data);
            
            if (data.success) {
                alert('✅ Booking cancelled! Check admin notifications.');
                loadBookings();
            } else {
                alert('❌ Error: ' + data.message);
            }
        } catch (error) {
            alert('❌ Network error');
        }
    }

    loadBookings();
</script>
</body>
</html>
