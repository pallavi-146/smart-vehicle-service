<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanic Commission - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="container mt-4">
    <h2>Mechanic Commission Settings</h2>
    <p>Set commission percentage for each mechanic (default: 60%)</p>
    <table class="table table-bordered">
        <thead>
            <tr><th>Mechanic Name</th><th>Email</th><th>Current Commission</th><th>Total Earnings</th><th>Update Commission</th>
        </thead>
        <tbody id="mechanicsList"></tbody>
    </table>
</div>
<script>
    const token = localStorage.getItem('token');
    async function loadMechanics() {
        const res = await fetch('/api/admin/mechanics-commission', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('mechanicsList').innerHTML = data.mechanics.map(m => `
                <tr>
                    <td>${m.name}</td>
                    <td>${m.email}</td>
                    <td><input type="number" id="comm_${m._id}" value="${m.commissionPercentage}" class="form-control" style="width:100px"> %</td>
                    <td>₹${m.earnings || 0}</td>
                    <td><button class="btn btn-sm btn-primary" onclick="updateCommission('${m._id}')">Update</button></td>
                </tr>
            `).join('');
        }
    }
    async function updateCommission(id) {
        const commission = document.getElementById(`comm_${id}`).value;
        const res = await fetch(`/api/admin/mechanic-commission/${id}`, {
            method: 'PUT',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ commissionPercentage: parseInt(commission) })
        });
        const data = await res.json();
        if (data.success) Swal.fire('Updated!', 'Commission updated', 'success');
        else Swal.fire('Error', data.message, 'error');
    }
    loadMechanics();
</script>
</body>
</html>
