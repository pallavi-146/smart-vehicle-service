<script>
    // Check authentication status and update navbar
    function updateNavbarAuth() {
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        const authLinks = document.getElementById('authLinks');
        
        if (authLinks) {
            if (token && user) {
                // User is logged in
                let dashboardLink = '';
                if (user.role === 'user') {
                    dashboardLink = '/user-dashboard';
                } else if (user.role === 'mechanic') {
                    dashboardLink = '/mechanic-dashboard';
                } else if (user.role === 'admin') {
                    dashboardLink = '/admin-dashboard';
                }
                
                authLinks.innerHTML = `
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-user-circle"></i> ${user.name || 'Account'}
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="${dashboardLink}">
                                <i class="fas fa-tachometer-alt"></i> Dashboard
                            </a></li>
                            <li><a class="dropdown-item" href="/pages/user/user-profile.html">
                                <i class="fas fa-user"></i> My Profile
                            </a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" id="logoutNavBtn">
                                <i class="fas fa-sign-out-alt"></i> Logout
                            </a></li>
                        </ul>
                    </li>
                `;
                
                // Add logout functionality
                const logoutBtn = document.getElementById('logoutNavBtn');
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        Swal.fire({
                            title: 'Logout?',
                            text: 'Are you sure you want to logout?',
                            icon: 'question',
                            showCancelButton: true,
                            confirmButtonText: 'Yes, Logout'
                        }).then((result) => {
                            if (result.isConfirmed) {
                                localStorage.clear();
                                window.location.href = '/login';
                            }
                        });
                    });
                }
            } else {
                // User is not logged in
                authLinks.innerHTML = `
                    <li class="nav-item">
                        <a class="nav-link btn btn-primary text-white px-3" href="/login">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-light px-3" href="/register">
                            <i class="fas fa-user-plus"></i> Register
                        </a>
                    </li>
                `;
            }
        }
    }
    
    // Dark mode toggle functionality
    function initDarkMode() {
        const darkModeToggle = document.getElementById('darkModeToggle');
        if (darkModeToggle) {
            darkModeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDarkMode = document.body.classList.contains('dark-mode');
                localStorage.setItem('darkMode', isDarkMode);
                
                // Update icon
                const icon = darkModeToggle.querySelector('i');
                if (isDarkMode) {
                    icon.classList.remove('fa-moon');
                    icon.classList.add('fa-sun');
                } else {
                    icon.classList.remove('fa-sun');
                    icon.classList.add('fa-moon');
                }
            });
            
            // Load saved preference
            const savedDarkMode = localStorage.getItem('darkMode') === 'true';
            if (savedDarkMode) {
                document.body.classList.add('dark-mode');
                const icon = darkModeToggle.querySelector('i');
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            }
        }
    }
    
    // Active link highlighting
    function highlightActiveLink() {
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.navbar-nav .nav-link');
        
        navLinks.forEach(link => {
            const href = link.getAttribute('href');
            if (href && href !== '#' && currentPath.includes(href)) {
                link.classList.add('active');
            } else if (href === '/#home' && currentPath === '/') {
                link.classList.add('active');
            }
        });
    }
    
    // Initialize when DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
        updateNavbarAuth();
        initDarkMode();
        highlightActiveLink();
    });
</script>
